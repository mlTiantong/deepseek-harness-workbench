[project]
name = "dsh-companion"
version = "0.1.0"
description = "Independent DSH-based companion, scheduler and workbench"
requires-python = ">=3.11"
dependencies = [
  "deepseek-harness-sdk==0.2.1rc2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "mcp==1.30.0",
  "bilibili-api-python==17.4.2",
  "playwright==1.64.1",
  "httpx>=0.27",
  "cryptography>=42",
  "qrcode[pil]>=7.4",
  "PyYAML>=6.0",
  "python-multipart>=0.0.20",
  "tzdata>=2025.1",
  "imageio-ffmpeg==0.6.0",
  "faster-whisper==1.2.1",
]

[project.scripts]
dsh-companion = "dsh_companion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsh_companion = ["*.mjs", "static/*"]
